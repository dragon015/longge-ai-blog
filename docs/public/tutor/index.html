<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>庖丁解牛 · GPT & RAG 实战闯关 Dojo</title>
<style>
  :root{
    --bg:#070b1a; --bg2:#0a1024; --panel:#0e1530; --panel2:#131c3d;
    --line:#22304f; --line2:#2d3f66;
    --cyan:#22d3ee; --purple:#a855f7; --amber:#fbbf24; --green:#34d399;
    --red:#f87171; --pink:#f472b6;
    --text:#e6ecff; --muted:#8ea0c9; --dim:#5e6f9c;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 85% -10%,#11203f 0%,var(--bg) 55%);color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  code,pre,.mono{font-family:"Cascadia Code",Consolas,"Courier New",monospace}

  #app{display:grid;grid-template-columns:272px 1fr;grid-template-rows:60px 1fr;height:100vh}
  header.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(90deg,rgba(34,211,238,.08),rgba(168,85,247,.08));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .brand{font-weight:800;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--cyan),var(--purple),var(--amber),var(--cyan));
    display:grid;place-items:center;font-size:16px;box-shadow:0 0 18px rgba(34,211,238,.45)}
  .brand small{color:var(--muted);font-weight:500;font-size:11px;display:block}
  .spacer{flex:1}
  .progress-wrap{display:flex;align-items:center;gap:10px;min-width:210px}
  .progress-bar{flex:1;height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .45s}
  .progress-txt{font-size:12px;color:var(--muted);white-space:nowrap}
  .btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:13px;transition:.18s;user-select:none;font-family:inherit}
  .btn:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.25)}
  .btn.primary{background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(168,85,247,.18));border-color:var(--cyan)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:5px 11px;font-size:12px}

  aside.sidebar{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
  .chap{margin-bottom:16px}
  .chap-head{font-size:12px;color:var(--dim);padding:6px 10px;letter-spacing:1px;font-weight:700}
  .lv{display:flex;align-items:center;gap:9px;padding:9px 10px;margin:3px 0;border-radius:9px;font-size:12.5px;
    color:var(--muted);border:1px solid transparent;cursor:pointer;transition:.15s}
  .lv:hover:not(.locked){background:var(--panel);color:var(--text)}
  .lv.active{background:var(--panel2);color:var(--text);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--cyan)}
  .lv.locked{opacity:.42;cursor:not-allowed}
  .lv.passed .badge{background:var(--green);border-color:var(--green);color:#04231a}
  .lv .badge{width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:10px;font-weight:700}

  main.content{overflow-y:auto;padding:22px 30px 90px}
  .stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:18px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .stp{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
    border:1.5px solid var(--line2);color:var(--dim);cursor:pointer;transition:.15s}
  .stp.done{background:var(--green);border-color:var(--green);color:#04231a}
  .stp.cur{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.5)}
  .stp.lock{opacity:.35;cursor:not-allowed}
  .stp-line{width:12px;height:2px;background:var(--line2)}

  .lvl-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
  .lvl-no{font-size:40px;font-weight:900;line-height:1;background:linear-gradient(160deg,var(--cyan),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;opacity:.85}
  .lvl-title{font-size:24px;font-weight:800;margin:0}
  .crumb{font-size:11.5px;color:var(--dim);margin-bottom:8px}
  .goal{background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(168,85,247,.06));border:1px solid var(--line2);
    border-left:4px solid var(--amber);border-radius:12px;padding:13px 16px;margin:14px 0;font-size:14px;line-height:1.7}
  .goal b{color:var(--amber)}

  .sec{margin-top:22px}
  .sec-h{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;margin-bottom:10px}
  .sec-h .num{width:22px;height:22px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);
    display:grid;place-items:center;font-size:11px;color:var(--cyan)}
  .sec-h .sub{font-size:11.5px;color:var(--dim);font-weight:400}

  .blade{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:9px;overflow:hidden}
  .blade-head{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;font-weight:600;font-size:14px}
  .blade-head .chev{margin-left:auto;transition:.2s;color:var(--muted);font-size:12px}
  .blade.open .chev{transform:rotate(90deg)}
  .blade-body{padding:0 16px 14px;font-size:13.5px;line-height:1.8;color:#cdd8f5;display:none}
  .blade.open .blade-body{display:block}
  .blade-body p{margin:8px 0}
  .blade-body code{background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--cyan)}
  .blade-body ul{margin:8px 0;padding-left:20px}
  .blade-body li{margin:5px 0}
  .formula{background:#060a18;border:1px solid var(--line2);border-radius:9px;padding:11px 13px;margin:10px 0;
    font-size:12.5px;color:#bfeaff;overflow-x:auto;line-height:1.7}

  /* 实验台 */
  .lab{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-top:10px}
  .lab-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:3px}
  .lab-hint{font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.6}
  .ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
  .ctl label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  input[type=range]{accent-color:var(--cyan)}
  input[type=text],input[type=number],textarea,select{background:var(--panel2);border:1px solid var(--line2);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;outline:none}
  input[type=text]:focus,textarea:focus,select:focus{border-color:var(--cyan)}
  textarea{width:100%;min-height:64px;resize:vertical;line-height:1.6}
  .out{background:#060a18;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-top:10px;
    font-size:12.5px;line-height:1.75;min-height:44px;max-height:290px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .out .k{color:var(--cyan)} .out .v{color:var(--amber)} .out .g{color:var(--green)} .out .r{color:var(--red)}
  .chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line2);
    border-radius:8px;padding:6px 9px;margin:3px;font-size:12px;min-width:44px}
  .chip .id{font-size:9.5px;color:var(--dim)}
  .chip.hl{border-color:var(--cyan);color:var(--cyan)}
  .grid8{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:6px 0}
  .cell{height:24px;border-radius:4px;display:grid;place-items:center;font-size:9.5px;color:#04121f;font-weight:700}
  table.tbl{border-collapse:collapse;margin:8px 0;font-size:11.5px;width:100%}
  table.tbl td,table.tbl th{border:1px solid var(--line);padding:5px 7px;text-align:center}
  table.tbl th{color:var(--muted);background:var(--panel)}
  table.tbl td.mask{background:#0a0f22;color:var(--dim)}
  table.tbl td.focus{box-shadow:inset 0 0 0 2px var(--amber)}
  .bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11.5px}
  .bar-name{width:150px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:14px;background:var(--panel2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0;transition:width .3s}
  .bar-fill.g{background:linear-gradient(90deg,var(--green),var(--cyan))}
  .bar-val{width:48px;text-align:right}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pane{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
  .pane h5{margin:0 0 7px;font-size:12.5px}
  .pane.bad{border-color:rgba(248,113,113,.5)} .pane.good{border-color:rgba(52,211,153,.5)}
  canvas{background:#060a18;border:1px solid var(--line);border-radius:10px;max-width:100%;touch-action:none}
  .stage-row{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .stage{padding:8px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:12px;transition:.15s}
  .stage:hover{border-color:var(--cyan)}
  .stage.active{background:linear-gradient(90deg,rgba(34,211,238,.2),rgba(168,85,247,.2));border-color:var(--cyan)}
  .chunk{display:inline-block;padding:7px 9px;margin:4px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;line-height:1.6;max-width:100%}
  .chunk .ov{background:rgba(251,191,36,.28);border-radius:3px;padding:0 2px}
  .promptblk{background:#060a18;border:1px solid var(--line2);border-radius:9px;padding:12px;font-size:12px;line-height:1.8;white-space:pre-wrap}
  .promptblk .sys{color:var(--purple)} .promptblk .ctx{color:var(--green)} .promptblk .q{color:var(--amber)} .promptblk .rule{color:var(--cyan)}

  /* 过关任务 */
  .tasks{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(135deg,rgba(52,211,153,.06),rgba(34,211,238,.04));padding:14px 16px;margin-top:10px}
  .task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .task:last-child{border-bottom:none}
  .tbox{width:19px;height:19px;flex:none;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;margin-top:1px;cursor:pointer}
  .task.done .tbox{background:var(--green);border-color:var(--green);color:#04231a}
  .task .tbody{flex:1;font-size:13px;line-height:1.6}
  .task .tbody .lbl{font-weight:600}
  .task .tbody .tip{font-size:11.5px;color:var(--dim);margin-top:2px}
  .opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .opt{padding:7px 11px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-size:12px;transition:.15s;background:var(--panel2)}
  .opt:hover{border-color:var(--cyan)}
  .opt.correct{border-color:var(--green);background:rgba(52,211,153,.14)}
  .opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12)}
  .why{font-size:11.5px;color:var(--muted);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);display:none}
  .why.show{display:block}
  .gate{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px dashed var(--line2);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--panel)}
  .gate.ok{border-color:var(--green);background:rgba(52,211,153,.07)}
  .gate .gtext{flex:1;font-size:13px;line-height:1.6}
  .gate .gtext b{color:var(--amber)}

  /* 真工程对照 */
  .eng{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0;margin-top:10px;overflow:hidden}
  .eng-h{display:flex;align-items:center;gap:9px;padding:12px 16px;background:linear-gradient(90deg,rgba(168,85,247,.10),transparent);font-weight:700;font-size:14px;cursor:pointer}
  .eng-h .chev{margin-left:auto;color:var(--muted);font-size:12px;transition:.2s}
  .eng.open .chev{transform:rotate(90deg)}
  .eng-b{padding:0 16px 16px;display:none}
  .eng.open .eng-b{display:block}
  .eng-row{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:start}
  .eng-row:last-child{border-bottom:none}
  .eng-row .k{color:var(--purple);font-weight:600}
  .eng-row .v{color:#cdd8f5;line-height:1.7}
  .codeblk{background:#050918;border:1px solid var(--line2);border-radius:9px;padding:12px 13px;font-size:11.5px;
    line-height:1.65;color:#bfeaff;overflow-x:auto;white-space:pre;margin:8px 0}
  .cmd{display:inline-block;background:#050918;border:1px solid var(--line2);border-left:3px solid var(--cyan);
    border-radius:6px;padding:6px 10px;font-size:11.5px;color:var(--cyan);margin:3px 0}
  .eng-note{font-size:12px;color:var(--amber);background:rgba(251,191,36,.07);border-radius:8px;padding:9px 11px;margin-top:9px;line-height:1.7}

  .modal-mask{position:fixed;inset:0;background:rgba(3,6,15,.74);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50}
  .modal-mask.show{display:grid}
  .modal{width:min(920px,93vw);max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px;box-shadow:var(--shadow);position:relative}
  .modal h2{margin:0 0 4px;font-size:21px}
  .modal .lead{color:var(--muted);font-size:12.5px;margin-bottom:18px;line-height:1.7}
  .close-x{position:absolute;top:14px;right:18px;cursor:pointer;color:var(--muted);font-size:20px}
  .mchap{font-size:13px;font-weight:700;color:var(--cyan);margin:16px 0 9px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .mnode{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:12.5px;cursor:pointer}
  .mnode.lock{opacity:.4;cursor:not-allowed}
  .mnode.done{border-color:var(--green)}
  .mnode .n{font-weight:600}
  .mnode .d{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
    border:1px solid var(--cyan);color:var(--text);padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);
    opacity:0;transition:.3s;z-index:60;font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.8}
  @media(max-width:820px){#app{grid-template-columns:1fr}aside.sidebar{display:none}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">🔪</span><div>庖丁解牛 · GPT &amp; RAG 实战 Dojo<small>手搓 GPT → 训练它 → 接上 RAG｜13 关 · 过关解锁</small></div></div>
    <div class="spacer"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div class="progress-txt" id="progTxt">0 / 13 关</div>
    </div>
    <button class="btn" id="roadmapBtn">🗺️ 路线图</button>
    <button class="btn" id="resetBtn" title="清空进度">↺</button>
  </header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<div class="modal-mask" id="roadmapModal">
  <div class="modal">
    <span class="close-x" id="closeModal">✕</span>
    <h2>🗺️ 庖丁解牛 · 13 刀路线图</h2>
    <div class="lead">一条主线走到底：<b>亲手造一个会预测下一个字的 GPT → 把它训练到 loss 下降 → 再给它接上「先查资料再回答」的 RAG</b>。每一刀都在浏览器里真跑一个迷你实验，并在「真工程对照」里指向你本机 <code>nano-gpt-practice/</code> 的对应文件与命令。完成该关全部任务才解锁下一刀。</div>
    <div id="mapBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   庖丁解牛 · GPT & RAG 实战闯关 Dojo
   单文件 / 零依赖 / 所有实验均为浏览器内真实计算（教学规模）
   ============================================================ */

/* ---------- 共用语料与工具（真计算） ---------- */
const CORPUS = "the quick brown fox jumps over the lazy dog. the model learns to predict the next token. " +
  "a language model reads the prefix and guesses the next character. training lowers the loss. " +
  "we repeat this game until the model speaks. the quick brown fox jumps over the lazy dog again. " +
  "attention lets each token look back at earlier tokens. the loss goes down step by step.";

const KB = [
  "【差旅制度】2026 年本公司国内差旅住宿标准为：一线城市每晚 600 元，其他城市每晚 400 元，需凭发票报销。",
  "【差旅制度】出差交通优先选择高铁二等座；飞行需提前 3 天申请，经济舱实报实销。",
  "【GPT 原理】GPT 是自回归模型，训练目标为预测下一个 token，损失用交叉熵，通过反向传播更新参数。",
  "【注意力】因果自注意力用 QKᵀ/√d 打分，上三角掩码屏蔽未来，softmax 归一化后加权求和 V。",
  "【RAG 原理】RAG 先检索外部知识片段，拼进 Prompt，让 LLM 仅依据上下文作答，可缓解幻觉并支持溯源。",
  "【切片】文档切片常用 300~800 字 chunk 并保留 10~20% overlap，避免知识点被边界切断。",
  "【采样】温度 T 缩放 logits，Top-k 截断候选；T 越大分布越平坦、生成越多样。",
];

function buildVocab(text){
  const chars=[...new Set(text.split(''))].sort();
  const stoi={},itos={}; chars.forEach((c,i)=>{stoi[c]=i;itos[i]=c;});
  return {chars,stoi,itos,V:chars.length};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function seeded(seed){let s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function softmax(a){const m=Math.max(...a);const e=a.map(x=>Math.exp(x-m));const s=e.reduce((p,q)=>p+q,0);return e.map(x=>x/s);}
function charVec(text, vocab){
  // 字符 unigram + bigram 词频向量（真实计算，用作教学级 embedding）
  const v={}; const t=text.toLowerCase().replace(/\s+/g,'');
  for(let i=0;i<t.length;i++){ v[t[i]]=(v[t[i]]||0)+1; if(i<t.length-1){const b=t.slice(i,i+2);v[b]=(v[b]||0)+0.6;} }
  return v;
}
function cosine(a,b){
  let dot=0,na=0,nb=0;
  for(const k in a){na+=a[k]*a[k]; if(b[k]!==undefined)dot+=a[k]*b[k];}
  for(const k in b)nb+=b[k]*b[k];
  return (na&&nb)?dot/Math.sqrt(na*nb):0;
}
function rankKB(query,k,hybrid){
  const q=charVec(query); const scores=KB.map((c,i)=>({i,c,s:cosine(q,charVec(c))}));
  if(hybrid){ // BM25 风格的关键词精确命中加权（教学简化）
    const kws=query.replace(/[，。？?、\s]/g,'').split('').filter(c=>/[\u4e00-\u9fff]/.test(c));
    scores.forEach(o=>{let hit=0;kws.forEach(w=>{if(o.c.includes(w))hit++;});o.s+=0.012*hit;});
  }
  return scores.sort((a,b)=>b.s-a.s).slice(0,k);
}

    {h:"为什么实验台用最简单的模型",b:"为了让你几秒内看到曲线下降，浏览器里跑的是最简版：只记「上一个字后面最常接哪个字」，也就是只看 1 个字的上下文。它和真工程的<b>目标完全相同</b>（都是猜下一个字、都按同一套扣分微调），只是把「能回头看多长」从 256 缩到 1。原理一模一样，规模差很多。"},
    {h:"扣分下降究竟意味着什么",b:"扣分衡量的是「模型给真正那个答案打了多少分」。从「闭眼瞎蒙」的水平一路降下来，说明它不再平均下注，而是真把「q 后面常跟 u」「逗号后面多半是空格」这类规律<b>写进了参数</b>。它没背下原文，却学会了原文的统计规律——这就是「大模型学会说话」最直观的证据。"},
    {h:"真工程多了哪些装备",b:"你本机的工程用的是 4 层完整模型、更聪明的 AdamW 优化器、学习率先慢慢升再慢慢降（预热 + 余弦退火）、给每步的改动设上限防止走崩（梯度裁剪），还每 200 步停下来考一次、生成一段样例、存一份进度文件。这些都是为了让大模型<b>训得动、训得稳</b>，上面那条主线一步没变。"},

  goal:"模型练完只会输出「每个候选字各有多少把握」，还不会说话。这一刀你亲手拨<b>温度</b>和<b>候选数</b>两个旋钮，看同一组把握怎么变出完全不同性格的文本，并一次一个字地走完整个写字循环。",
  blades:[
    {h:"为什么是一个字一个字挤出来",b:"模型一次只算「下一个字」。挑出来之后，把它<b>接回原句末尾</b>，再拿加长后的句子重新算下一个……如此循环到你喊停。这种「用自己刚写出来的字继续往下写」的方式叫<b>自回归</b>。它顺带解释了两个现象：长文越写越慢，以及前面写歪了后面会一路跟着歪。实验台里点 5 次「生成下一个字」，就是在手动走这个圈。"},
    {h:"温度：胆子大小的旋钮",b:"把所有打分一起除以一个数，再换算成比例：数小（低温）→ 差距被放大，几乎只挑最有把握的那个，稳但死板；数大（高温）→ 差距被抹平，冷门字也有机会冒出来，更有创意也更容易胡说。温度趋近 0，就退化成「永远选第一名」。真工程默认 0.8。"},
    {h:"只留前几名：给抽签划个范围",b:"字典里很多字把握低得可怜，留着它们只会偶尔蹦出个怪字。于是<b>只保留分数最高的 k 个候选</b>，其余直接出局。k 太小容易单调，太大又放回噪声。真工程默认 k=10；产品里还常加按累计概率划界的 Top-p 和重复惩罚。"},
    {h:"为什么不永远选把握最大的",b:"总挑第一名，句子会很快绕回同一个圈（「的的的的…」），读起来又闷又容易卡死。按把握<b>抽签</b>才有多样性——这也是同一个问题问两次、答案不完全一样的原因。注意抽签不等于乱来：把握大的被抽中的机会仍然高得多。"},

  blades:[
    {h:"凭记忆说话，会撞上三堵墙",b:"① <b>时效</b>：训练结束之后发生的事，它一概不知道；② <b>私有</b>：你公司的制度、你的笔记，训练时根本没见过；③ <b>幻觉</b>：不知道时它不会闭嘴，而是按「怎么说最像话」编一个顺溜的答案（博客那篇《大模型为什么会出现幻觉》专门讲这件事）。三堵墙的共同根源是：<b>知识被焊死在参数里</b>，改一次就得重新训练。"},
    {h:"RAG 就是改成开卷考试",b:"思路特别朴素：回答问题前，<b>先去资料库里把相关的几段找出来，连同问题一起交给模型</b>，让它照着资料答。于是知识放在外面，随时能更新、能溯源、能按权限控制。三个动作各取一个字母：<b>R</b> 检索（找资料）、<b>A</b> 增强（把资料拼进问题）、<b>G</b> 生成（作答）。"},
    {h:"它和「重新训练 / 微调」怎么选",b:"补新知识、查最新资料、要给出处 → 用 RAG，改资料库就行，几分钟生效；改语气、学一种新技能、固化风格 → 用微调，得动参数。生产里常常一起用：<b>微调定风格，RAG 供事实</b>。判断口诀：知识会变就外置，能力要变才训练。"},

  blades:[

    func:"读文档 → 按长度 + 重叠滑动切 → 每段附来源信息 → 存成 chunks.jsonl 给后面用。下面代码就是那个滑动窗口循环。",
    code:"import json, pathlib\n\ndef chunk(text, size=400, overlap=60):\n    out, i, cid = [], 0, 0\n    while i < len(text):\n        seg = text[i:i+size]\n        out.append(dict(chunk_id=cid, text=seg,\n                        source='kb/handbook.md', start=i))\n        i += size - overlap\n        cid += 1\n    return out\n\nchunks = chunk(pathlib.Path('kb/handbook.md').read_text(encoding='utf-8'))\nwith open('chunks.jsonl','w',encoding='utf-8') as f:\n    for c in chunks: f.write(json.dumps(c, ensure_ascii=False)+'\\n')",

/* ---------- 进度状态 ---------- */
const KEY='gptrag_dojo_v3';
let S={done:{},tasks:{}};
try{const raw=localStorage.getItem(KEY); if(raw)S=JSON.parse(raw);}catch(e){}
if(!S.done)S.done={}; if(!S.tasks)S.tasks={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function isUnlocked(id){ if(id===1)return true; return !!S.done[id-1]; }
function levelDone(id){ const L=LEVELS.find(x=>x.id===id); return L.tasks.every(t=>S.tasks[id+'_'+t.k]); }
function taskKey(id,k){return id+'_'+k;}
function completedCount(){return LEVELS.filter(L=>S.done[L.id]).length;}

/* ---------- 布局 ---------- */
function buildSidebar(){
  const sb=document.getElementById('sidebar'); sb.innerHTML='';
  CHAPTERS.forEach(ch=>{
    const d=document.createElement('div'); d.className='chap';
    d.innerHTML='<div class="chap-head">'+ch.t+'</div>';
    ch.levels.forEach(id=>{
      const L=LEVELS.find(x=>x.id===id); const un=isUnlocked(id); const done=!!S.done[id];
      const el=document.createElement('div');
      el.className='lv'+(un?'':' locked')+(done?' passed':'')+(CUR===id?' active':'');
      el.innerHTML='<span class="badge">'+(done?'✓':(un?id:'🔒'))+'</span><span>'+esc(L.title)+'</span>';
      el.onclick=()=>{ if(!un){toast('🔒 先通关第 '+(id-1)+' 刀');return;} go(id); };
      d.appendChild(el);
    });
    sb.appendChild(d);
  });
  updateProg();
}
function updateProg(){
  const c=completedCount();
  document.getElementById('progFill').style.width=Math.round(c/LEVELS.length*100)+'%';
  document.getElementById('progTxt').textContent=c+' / '+LEVELS.length+' 关';
}
function buildStepper(){
  let h='';
  LEVELS.forEach((L,i)=>{
    const un=isUnlocked(L.id),done=!!S.done[L.id];
    h+='<div class="stp '+(done?'done':(CUR===L.id?'cur':''))+(un?'':' lock')+'" data-id="'+L.id+'" title="第 '+L.id+' 刀：'+esc(L.title)+'">'+(done?'✓':L.id)+'</div>';
    if(i<LEVELS.length-1)h+='<div class="stp-line"></div>';
  });
  return '<div class="stepper">'+h+'</div>';
}

/* ---------- 任务引擎 ---------- */
/* 实验台挂载瞬间的首次 run()/draw() 会算出初始状态，
   若这些函数直接 hit() 就会「打开页面即白送任务」。
   用 EXP_READY 守卫：挂载期间抑制自动判定，只有用户真实交互(输入/点击)触发的 hit 才计入。*/
var EXP_READY=true;
function renderTasks(){
  const L=LEVELS.find(x=>x.id===CUR), box=document.getElementById('tasks');
  let h='';
  L.tasks.forEach((t,i)=>{
    const ok=!!S.tasks[taskKey(L.id,t.k)];
    h+='<div class="task '+(ok?'done':'')+'" data-k="'+t.k+'"><div class="tbox">'+(ok?'✓':'')+'</div><div class="tbody"><div class="lbl">'+(i+1)+'. '+esc(t.lbl)+'</div><div class="tip">'+esc(t.tip||'')+'</div>';
    if(t.type==='quiz'){
      h+='<div class="opts">'+t.opts.map((o,oi)=>'<span class="opt" data-oi="'+oi+'">'+esc(o)+'</span>').join('')+'</div><div class="why"></div>';
    }
    h+='</div></div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.task').forEach(el=>{
    const k=el.dataset.k, t=L.tasks.find(x=>x.k===k);
    const tb=el.querySelector('.tbox');
    if(t.type==='check'){ tb.onclick=()=>{ const key=taskKey(L.id,k); S.tasks[key]=!S.tasks[key]; save(); renderTasks(); checkGate(); }; }
    if(t.type==='quiz'){
      el.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
        if(!!S.tasks[taskKey(L.id,k)])return;
        const oi=+o.dataset.oi, why=el.querySelector('.why');
        why.classList.add('show');
        if(oi===t.a){ o.classList.add('correct'); why.innerHTML='✅ 正确。'+t.why; hit(k); }
        else { o.classList.add('wrong'); why.innerHTML='❌ 再想想。'+t.why; }
      });
    }
  });
  checkGate();
}
function hit(k){
  if(!EXP_READY)return;               // 挂载瞬间的自动判定不算，必须用户亲手操作
  const L=LEVELS.find(x=>x.id===CUR), t=L&&L.tasks.find(x=>x.k===k);
  if(!t)return;                        // 防御：任务 key 拼错时静默忽略，绝不白屏
  const key=taskKey(CUR,k);
  if(S.tasks[key])return;
  S.tasks[key]=true; save();
  toast('✅ 任务完成：'+t.lbl);
  renderTasks();
  checkGate();
}
function checkGate(){
  const L=LEVELS.find(x=>x.id===CUR), ok=levelDone(L.id), gate=document.getElementById('gate');
  if(!gate)return;
  if(ok){
    if(!S.done[L.id]){ S.done[L.id]=true; save(); updateProg(); buildSidebar(); toast('🎉 第 '+L.id+' 刀通关！下一刀已解锁'); }
    const nx=L.id+1;
    gate.className='gate ok';
    gate.innerHTML='<div class="gtext"><b>🎉 本刀已通关</b> —— 原理、实验、动手任务全部完成，真工程对照记得在本机复现。</div>'+
      (nx<=LEVELS.length?'<button class="btn primary" id="nextBtn">解锁下一刀 →</button>':'<button class="btn primary" id="nextBtn">🗺️ 查看路线图</button>');
    gate.querySelector('#nextBtn').onclick=()=>{ if(nx<=LEVELS.length)go(nx); else openRoadmap(); };
  }else{
    const left=L.tasks.filter(t=>!S.tasks[taskKey(L.id,t.k)]).length;
    gate.className='gate';
    gate.innerHTML='<div class="gtext">🔒 <b>还剩 '+left+' 项任务</b>未完成。完成全部任务后自动解锁下一刀。</div><button class="btn" disabled>下一刀 🔒</button>';
  }
}

/* ---------- 实验台 ---------- */
function mountExp(type,box,L){
  const fn=EXP[type];
  if(fn){
    EXP_READY=false;                       // 同步挂载期的首次 run()/draw() 禁止判定任务
    try{ fn(box,L); } finally { EXP_READY=true; }  // 返回后恢复，用户交互(异步事件)才计入
  } else box.innerHTML='<div class="lab-hint">（本关为清单式实战）</div>';
}

/* 第 4 刀：注意力真算 */
EXP.attention=function(box,L){
  box.innerHTML='<div class="lab-head">🧪 因果自注意力计算器（真实矩阵运算）</div>'+
   '<div class="lab-hint">拿「我 爱 学 大 模 型」这 6 个字，每组 4 个数字，下面是真算出来的：两两打相关分 → 缩小分数 → 挡住后面的字 → 换算成比例。点一行、拨开关，看它怎么变。</div>'+
   '<div class="ctl">'+
     '<label><input type="checkbox" id="aScale" checked> 除以 √d 缩放</label>'+
     '<label><input type="checkbox" id="aMask" checked> 因果掩码</label>'+
     '<span class="lab-hint" id="aNote" style="margin:0"></span>'+
   '</div><div class="out" id="aOut" style="max-height:none"></div>';
  const seq=['我','爱','学','大','模','型'],n=seq.length,d=4,rnd=seeded(777);
  const Q=seq.map(()=>Array.from({length:d},()=>rnd()*2-1));
  const K=seq.map(()=>Array.from({length:d},()=>rnd()*2-1));
  const V=seq.map(()=>Array.from({length:d},()=>rnd()*2-1));
  const sc=box.querySelector('#aScale'),mk=box.querySelector('#aMask'),out=box.querySelector('#aOut'),note=box.querySelector('#aNote');
  let active=-1,scaleTouched=false,maskTouched=false;
  function dot(a,b){let s=0;for(let i=0;i<d;i++)s+=a[i]*b[i];return s;}
  function compute(){
    const rows=[]; let maxW=0,entSum=0;
    for(let i=0;i<n;i++){
      let sco=[]; for(let j=0;j<n;j++){ let v=dot(Q[i],K[j]); if(sc.checked)v/=Math.sqrt(d); if(mk.checked&&j>i)v=-Infinity; sco.push(v); }
      const p=sco.map(x=>x===-Infinity?0:Math.exp(x-(Math.max(...sco.filter(x=>x!==-Infinity)))));
      const sum=p.reduce((a,b)=>a+b,0); const w=p.map(x=>x/sum);
      maxW=Math.max(maxW,Math.max(...w)); entSum+=-w.reduce((a,b)=>a+(b>0?b*Math.log(b):0),0);
      rows.push(w);
    }
    const oV=rows.map((w,i)=>Array.from({length:d},(_,k)=>w.reduce((s,p,j)=>s+p*V[j][k],0).toFixed(2)));
    let h='<table class="tbl"><tr><th>行↓ 列→</th>'+seq.map(s=>'<th>'+s+'</th>').join('')+'</tr>';
    rows.forEach((w,i)=>{ h+='<tr><th data-i="'+i+'" style="cursor:pointer;color:var(--cyan)">'+seq[i]+'</th>';
      w.forEach((p,j)=>{ const masked=mk.checked&&j>i; h+='<td class="'+(masked?'mask ':((active===i&&p>0.12)?'focus':''))+'" '+(masked?'':'style="background:rgba(251,191,36,'+(0.06+0.7*p).toFixed(2)+')"')+'>'+(masked?'·':(p*100).toFixed(1)+'%')+'</td>'; });
      h+='</tr>'; });
    h+='</table>';
    h+='\n<span class="k">最大权重</span> = <span class="v">'+maxW.toFixed(3)+'</span>   <span class="k">平均熵</span> = <span class="v">'+(entSum/n).toFixed(3)+'</span>'+
       (sc.checked?'  <span class="g">（已缩放：分布平滑，梯度健康）</span>':'  <span class="r">（未缩放：分数被放大，softmax 趋于饱和/one-hot，梯度变小）</span>')+
       '\n<span class="k">输出 o = Σ w·V（第 '+(active>=0?seq[active]:'—')+' 行）</span>：'+(active>=0?'['+oV[active].join(', ')+']':'点任意行查看加权求和结果')+
       '\n<span class="k">说明</span>：每行权重和为 1；灰色格 = 被掩码屏蔽的未来位置（权重 0）。';
    out.innerHTML=h;
    out.querySelectorAll('th[data-i]').forEach(th=>th.onclick=()=>{active=+th.dataset.i;compute();hit('row');});
    note.textContent='点行可查看关注分布与加权 V 输出';
  }
  sc.onchange=()=>{compute();if(!scaleTouched){scaleTouched=true;hit('scale');}};
  mk.onchange=()=>{compute();if(!maskTouched){maskTouched=true;hit('mask');}};
  compute();
};

EXP.train=function(box,L){
  box.innerHTML='<div class="lab-head">🧪 可训练字符级语言模型（真·梯度下降）</div>'+

   '<div class="ctl">'+
     '<label>学习率 lr <input type="range" id="tLr" min="0.1" max="3" step="0.1" value="1.0"><span id="tLrv">1.0</span></label>'+

     '<button class="btn sm" id="tReset">↺ 重置</button>'+
   '</div><div class="out" id="tStat"></div>'+
   '<div class="ctl" style="margin-top:10px"><canvas id="tCanvas" width="520" height="150"></canvas></div>'+
   '<div class="out" id="tSample"></div>';
  const {chars,stoi,itos,V}=buildVocab(CORPUS);
  const data=[...CORPUS].map(c=>stoi[c]); const pairs=[];
  for(let i=0;i<data.length-1;i++)pairs.push([data[i],data[i+1]]);
  let W,lr=1.0,step=0,losses=[],lrTouched=false,trained=false,sampled=false;
  const stat=box.querySelector('#tStat'),cv=box.querySelector('#tCanvas'),ctx=cv.getContext('2d'),samp=box.querySelector('#tSample');
  function reset(){W=Array.from({length:V},()=>new Array(V).fill(0));step=0;losses=[];trained=false;sampled=false;loss();draw();samp.innerHTML='（还没生成。先训练几步，再点「用当前模型生成一句话」）';}
  function loss(){
    let L=0; for(const [x,y] of pairs){const p=softmax(W[x]);L+=-Math.log(Math.max(1e-9,p[y]));}
    return L/pairs.length;
  }
  function trainStep(n){
    for(let s=0;s<n;s++){
      const grad=Array.from({length:V},()=>new Array(V).fill(0)); const cnt=new Array(V).fill(0);
      for(const [x,y] of pairs){const p=softmax(W[x]);for(let j=0;j<V;j++)grad[x][j]+=p[j]-(j===y?1:0);cnt[x]++;}
      for(let i=0;i<V;i++)if(cnt[i]>0)for(let j=0;j<V;j++)W[i][j]-=lr*grad[i][j]/cnt[i];
      step++; if(step%2===0)losses.push(loss());
    }
    trained=true; const cur=loss();
    stat.innerHTML='<span class="k">训练步数</span> = <span class="v">'+step+'</span>   <span class="k">当前 loss</span> = <span class="v">'+cur.toFixed(4)+'</span>   <span class="k">初始基线 ln(V)</span> = '+Math.log(V).toFixed(4)+
      '\n<span class="k">参数量</span> = V×V = '+V*V+'   <span class="k">lr</span> = '+lr.toFixed(1)+'   <span class="g">loss 下降 = 模型真的学到了字符转移规律</span>';
    draw();
    if(step>=30&&cur<2.6)hit('train');
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='#1b2647';ctx.lineWidth=1;
    for(let i=0;i<4;i++){const y=20+i*30;ctx.beginPath();ctx.moveTo(34,y);ctx.lineTo(cv.width-10,y);ctx.stroke();}
    ctx.fillStyle='#5e6f9c';ctx.font='10px sans-serif';
    ctx.fillText('ln(V)='+Math.log(V).toFixed(1),2,24);ctx.fillText('2.6',14,80);ctx.fillText('loss',2,145);
    if(losses.length<2){ctx.fillStyle='#8ea0c9';ctx.fillText('点「训练 10 步」开始，这里会出现真实 loss 曲线',60,80);return;}
    const maxL=Math.max(...losses,Math.log(V)),minL=Math.min(...losses,1.0);
    ctx.strokeStyle='#fbbf24';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    const y26=20+((maxL-2.6)/(maxL-minL||1))*90;ctx.beginPath();ctx.moveTo(34,y26);ctx.lineTo(cv.width-10,y26);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.beginPath();
    losses.forEach((v,i)=>{const x=34+i/(losses.length-1)*(cv.width-48),y=20+((maxL-v)/(maxL-minL||1))*90;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();ctx.fillStyle='#22d3ee';ctx.fillText(losses[losses.length-1].toFixed(3),cv.width-46,Math.max(14,20+((maxL-losses[losses.length-1])/(maxL-minL||1))*90-6));
  }
  function generate(){
    let cur=stoi['t'],s='t'; for(let i=0;i<60&&s.length<60;i++){const p=softmax(W[cur]);let r=Math.random(),acc=0,nx=p.length-1;for(let j=0;j<p.length;j++){acc+=p[j];if(r<=acc){nx=j;break;}}s+=itos[nx];cur=nx;}
    samp.innerHTML='<span class="k">训练前（W=0，均匀分布 → 纯随机）</span>：\n  '+genRandom()+'\n<span class="g">当前模型（step='+step+'）生成</span>：\n  '+esc(s)+
      '\n<span class="k">对比</span>：'+(step<10?'还太早，多训练几步再看':'是不是开始出现 the / model / token 这类常见字母组合？这就是 loss 下降的文字证据。');
    sampled=true; if(step>=10)hit('sample');
  }
  function genRandom(){let s='t';for(let i=0;i<55;i++)s+=chars[Math.floor(Math.random()*V)];return esc(s);}
  box.querySelector('#tLr').oninput=e=>{lr=+e.target.value;document.getElementById('tLrv').textContent=lr.toFixed(1);if(!lrTouched){lrTouched=true;hit('lr');}};
  box.querySelector('#tStep').onclick=()=>trainStep(10);
  box.querySelector('#tAll').onclick=()=>{let n=0;const timer=setInterval(()=>{trainStep(5);n++;if(n>=16)clearInterval(timer);},40);};
  box.querySelector('#tGen').onclick=generate;
  box.querySelector('#tReset').onclick=reset;
  reset();
};

/* 第 6 刀：采样 */
EXP.sampling=function(box,L){
  const {chars,stoi,itos,V}=buildVocab(CORPUS);
  const cnt={}; for(let i=0;i<CORPUS.length-1;i++){if(CORPUS[i]==='t'){cnt[CORPUS[i+1]]=(cnt[CORPUS[i+1]]||0)+1;}}
  const vocab=Object.keys(cnt),base=vocab.map(c=>Math.log(cnt[c]+0.5)+2.2);
  box.innerHTML='<div class="lab-head">🧪 采样实验室：温度 / Top-k / 自回归</div>'+
   '<div class="lab-hint">以上文这个字在原文里真实出现过的后继统计，当作模型对每个候选字的把握。拖滑块看这些把握怎么被重新分配，再点「生成下一个字」逐字往外写。</div>'+
   '<div class="ctl">'+
     '<label>温度 T <input type="range" id="sT" min="0.1" max="2.5" step="0.1" value="1"><span id="sTv">1.0</span></label>'+
     '<label>Top-k <input type="range" id="sK" min="1" max="'+vocab.length+'" step="1" value="'+vocab.length+'"><span id="sKv">'+vocab.length+'</span></label>'+
     '<button class="btn sm primary" id="sGen">生成下一个字 →</button>'+
     '<button class="btn sm" id="sRoll">🎲 抽 5 次</button>'+
   '</div><div id="sBars"></div><div class="out" id="sOut"></div>';
  const T=box.querySelector('#sT'),K=box.querySelector('#sK'),bars=box.querySelector('#sBars'),out=box.querySelector('#sOut');
  let seq='t',genCount=0,tempHit=false,topkHit=false,genHit=false;
  function probs(){
    const t=+T.value,k=+K.value;
    document.getElementById('sTv').textContent=t.toFixed(1);document.getElementById('sKv').textContent=k;
    let lg=base.map(x=>x/t);
    const ord=lg.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
    const keep=new Set(ord.slice(0,k).map(o=>o[1]));
    const capped=lg.map((v,i)=>keep.has(i)?v:-Infinity);
    const m=Math.max(...capped);const e=capped.map(x=>x===-Infinity?0:Math.exp(x-m));const s=e.reduce((a,b)=>a+b,0);
    return e.map(x=>x/s);
  }
  function draw(){
    const p=probs();
    bars.innerHTML=vocab.map((c,i)=>'<div class="bar-row"><span class="bar-name">「'+esc(c===' '?'␣':c)+'」 logits='+base[i].toFixed(2)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(p[i]*100).toFixed(1)+'%"></div></div><span class="bar-val">'+(p[i]*100).toFixed(1)+'%</span></div>').join('');
  }
  function sample(){const p=probs();let r=Math.random(),a=0;for(let i=0;i<p.length;i++){a+=p[i];if(r<=a)return vocab[i];}return vocab[vocab.length-1];}
  T.oninput=()=>{draw();if(+T.value>=1.5&&!tempHit){tempHit=true;hit('temp');}};
  K.oninput=()=>{draw();if(+K.value<=3&&!topkHit){topkHit=true;hit('topk');}};
  box.querySelector('#sGen').onclick=()=>{seq+=sample();genCount++;out.innerHTML='<span class="k">自回归序列（逐字拼回输入再预测）</span>：\n  <span class="v">'+esc(seq)+'</span>\n'+
    '<span class="k">已生成</span> = '+genCount+' 字   <span class="k">循环</span>：取最后一个位置 logits → /T → Top-k → softmax → 抽样 → cat 拼回 → 再来一次';
    if(genCount>=5&&!genHit){genHit=true;hit('gen');}};
  box.querySelector('#sRoll').onclick=()=>{const a=[];for(let i=0;i<5;i++)a.push(sample());out.innerHTML='<span class="k">同一分布抽 5 次</span>：'+a.map(c=>'「'+esc(c===' '?'␣':c)+'」').join(' ')+'\n<span class="g">按概率抽样所以结果不同 —— 这就是生成多样性的来源；T→0 时 5 次会完全相同（贪心）。</span>';};
  draw();out.innerHTML='点「生成下一个字」开始自回归循环。';
};

/* 第 9 刀：切片 */
EXP.chunking=function(box,L){
  const sample='检索增强生成（RAG）让大模型先查资料再回答，能有效缓解幻觉。但切片策略直接决定检索上限：切太大噪声多，切太小丢上下文。常用固定长度加重叠或语义切分，并保留来源元数据以便溯源。生产环境中还会按标题与段落边界切分，避免把一个完整制度拦腰截断。';
  box.innerHTML='<div class="lab-head">🧪 文档切片器（真实切分）</div>'+
   '<div class="lab-hint">琥珀色 = 和上一张卡片重复的那段。拖动两个滑块，看卡片数和边界怎么变；真工程里每张卡还得记下出处。</div>'+
   '<div class="ctl"><label>size <input type="number" id="cS" value="40" min="12" max="120" step="4"></label>'+
   '<label>overlap <input type="number" id="cO" value="8" min="0" max="40" step="2"></label></div>'+
   '<textarea id="cT">'+sample+'</textarea><div class="out" id="cOut" style="max-height:none"></div>';
  const S=box.querySelector('#cS'),O=box.querySelector('#cO'),T=box.querySelector('#cT'),out=box.querySelector('#cOut');
  let sizeT=false,ovT=false;
  function run(){
    const s=Math.max(6,+S.value||40),o=Math.min(s-1,Math.max(0,+O.value||0));
    const txt=T.value,ch=[];let i=0;while(i<txt.length){ch.push(txt.slice(i,i+s));i+=Math.max(1,s-o);}
    out.innerHTML='<span class="k">共 '+ch.length+' 块</span> · size='+s+' · overlap='+o+' · 每块带元数据 {chunk_id, source:\'kb/handbook.md\', start}\n\n'+
      ch.map((c,idx)=>{const ov=c.slice(Math.max(0,c.length-o)),main=c.slice(0,Math.max(0,c.length-o));
        return '<span class="chunk"><span class="k">['+idx+']</span> '+esc(main)+(ov?'<span class="ov">'+esc(ov)+'</span>':'')+'</span>';}).join('')+
      '\n\n<span class="g">观察</span>：overlap 越大，跨边界的完整语义越不容易丢，但冗余与存储也越多（经验 10~20%）。';
    if(o>=8&&!ovT){ovT=true;hit('ov');}
  }
  S.oninput=()=>{run();if(!sizeT){sizeT=true;hit('size');}};
  O.oninput=run; T.oninput=run; run();
};

/* 第 10 刀：余弦 */
EXP.cosine=function(box,L){
  box.innerHTML='<div class="lab-head">🧪 文本向量与余弦相似度（真实计算）</div>'+
   '<div class="lab-hint">输入一个问题，按「用了哪些字、哪些相邻字组合」真算它和 7 张卡片有多像。下方画布可以拖箭头，直接感受夹角和相似度的关系。</div>'+
   '<div class="ctl"><input type="text" id="kQ" value="差旅住宿标准" style="width:260px"><button class="btn sm primary" id="kGo">计算相似度 →</button></div>'+
   '<div id="kBars"></div>'+
   '<div class="ctl" style="margin-top:14px"><canvas id="kCv" width="380" height="240"></canvas><div class="out" id="kCos" style="flex:1;min-width:180px"></div></div>';
  const q=box.querySelector('#kQ'),bars=box.querySelector('#kBars');
  function run(){
    const qv=charVec(q.value); if(!Object.keys(qv).length){bars.innerHTML='<span class="lab-hint">请输入查询</span>';return;}
    const sc=KB.map((c,i)=>({i,c,s:cosine(qv,charVec(c))})).sort((a,b)=>b.s-a.s);
    bars.innerHTML=sc.map(o=>'<div class="bar-row"><span class="bar-name" title="'+esc(o.c)+'">['+(o.i+1)+'] '+esc(o.c.slice(0,16))+'…</span><div class="bar-track"><div class="bar-fill '+(o===sc[0]?'g':'')+'" style="width:'+Math.max(0,o.s*100).toFixed(1)+'%"></div></div><span class="bar-val">'+o.s.toFixed(3)+'</span></div>').join('')+
      '\n<span class="g">最高分</span>：第 ['+(sc[0].i+1)+'] 块 —— 第 11 刀的检索就是把这个排序取前 k 条。';
    hit('query');
  }
  q.oninput=run; box.querySelector('#kGo').onclick=run; run();
  // 可拖动画布
  const cv=box.querySelector('#kCv'),ctx=cv.getContext('2d'),co=box.querySelector('#kCos');
  const cx=cv.width/2,cy=cv.height/2; let A={x:120,y:-40},B={x:90,y:70},drag=null,dragHit=false;
  function conv(v){return{x:cx+v.x,y:cy-v.y};}
  function drawC(){
    ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#1b2647';ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(cv.width,cy);ctx.moveTo(cx,0);ctx.lineTo(cx,cv.height);ctx.stroke();
    const pa=conv(A),pb=conv(B);
    function arrow(p,col){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.stroke();const a=Math.atan2(p.y-cy,p.x-cx),h=10;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-h*Math.cos(a-.4),p.y-h*Math.sin(a-.4));ctx.lineTo(p.x-h*Math.cos(a+.4),p.y-h*Math.sin(a+.4));ctx.closePath();ctx.fill();}
    arrow(pa,'#22d3ee');arrow(pb,'#a855f7');
    const dot=A.x*B.x+A.y*B.y,na=Math.hypot(A.x,A.y),nb=Math.hypot(B.x,B.y),cs=dot/(na*nb),deg=Math.acos(Math.max(-1,Math.min(1,cs)))*180/Math.PI;
    co.innerHTML='<span class="k">A·B</span> = '+dot.toFixed(0)+'\n<span class="k">|A||B|</span> = '+(na*nb).toFixed(0)+'\n<span class="v">cosθ</span> = <b style="color:var(--amber)">'+cs.toFixed(3)+'</b>\n<span class="k">夹角</span> = '+deg.toFixed(1)+'°\n\n'+(deg<30?'<span class="g">✅ 夹角 < 30°，语义方向高度一致</span>':'拖动任一箭头端点，让夹角小于 30°');
    if(deg<30&&!dragHit){dragHit=true;hit('drag');}
  }
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};const a=conv(A),b=conv(B);if(Math.hypot(p.x-a.x,p.y-a.y)<20)drag='A';else if(Math.hypot(p.x-b.x,p.y-b.y)<20)drag='B';});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},v={x:p.x-cx,y:cy-p.y};if(drag==='A')A=v;else B=v;drawC();});
  window.addEventListener('pointerup',()=>drag=null);
  drawC();
};

/* 第 11 刀：检索 */
EXP.retrieval=function(box,L){
  box.innerHTML='<div class="lab-head">🧪 top-k 检索器（真实排序）</div>'+
   '<div class="lab-hint">输入问题 → 真算相似度 → 取最像的前几张。打开「关键词混合」，看那些必须一字不差的编号、专有名词怎么被救回来。</div>'+
   '<div class="ctl"><input type="text" id="rQ" value="差旅住宿标准是多少" style="width:240px">'+
     '<label>k <input type="range" id="rK" min="1" max="5" step="1" value="1"><span id="rKv">1</span></label>'+
     '<label><input type="checkbox" id="rH"> + 关键词混合(BM25 风格)</label>'+
     '<button class="btn sm primary" id="rGo">检索 →</button></div>'+
   '<div class="out" id="rOut" style="max-height:none"></div>'+
   '<div class="lab-hint" style="margin-top:10px">试试这些预设：<span class="chip" data-q="注意力 掩码 QK">注意力掩码</span><span class="chip" data-q="采样 温度 topk">采样温度</span><span class="chip" data-q="切片 overlap 元数据">切片重叠</span></div>';
  const q=box.querySelector('#rQ'),k=box.querySelector('#rK'),h=box.querySelector('#rH'),out=box.querySelector('#rOut');
  let searched=false,kTouched=false,hybTouched=false;
  function run(){
    document.getElementById('rKv').textContent=k.value;
    const res=rankKB(q.value,+k.value,h.checked);const qv=charVec(q.value);
    const all=KB.map((c,i)=>({i,c,s:cosine(qv,charVec(c))})).sort((a,b)=>b.s-a.s);
    out.innerHTML='<span class="k">query</span>：「'+esc(q.value)+'」  k='+k.value+'  hybrid='+(h.checked?'ON':'OFF')+'\n'+
      '<span class="k">全量相似度排序</span>：\n'+all.map((o,n)=>'  '+(n+1)+'. ['+(o.i+1)+'] cos='+o.s.toFixed(3)+'  '+esc(o.c.slice(0,30))+'…').join('\n')+
      '\n\n<span class="g">返回 top-'+k.value+'</span>：\n'+res.map((o,n)=>'  <span class="v">['+(n+1)+'] 得分 '+o.s.toFixed(3)+'</span>  '+esc(o.c)+'').join('\n')+
      '\n\n<span class="k">下一步</span>：把这些块连同 source 元数据交给第 12 刀拼进 Prompt。';
    if(!searched){searched=true;hit('search');}
  }
  q.oninput=run;k.oninput=()=>{run();if(+k.value>=3&&!kTouched){kTouched=true;hit('topk');}};
  h.onchange=()=>{run();if(h.checked&&!hybTouched){hybTouched=true;hit('hybrid');}};
  box.querySelector('#rGo').onclick=run;
  box.querySelectorAll('.chip[data-q]').forEach(c=>c.onclick=()=>{q.value=c.dataset.q;run();});
  run();
};

/* 第 12 刀：拼 Prompt */
EXP.augment=function(box,L){
  box.innerHTML='<div class="lab-head">🧪 Prompt 拼装器 + 约束开关</div>'+
   '<div class="lab-hint">把找到的卡片拼成一张完整的开卷题，再开关「只准照资料答」那条规矩，看答案守不守得住证据。</div>'+
   '<div class="ctl"><label><input type="checkbox" id="gRule" checked> 仅依据上下文（抑制幻觉约束）</label>'+
     '<button class="btn sm primary" id="gGo">拼装 Prompt →</button>'+
     '<button class="btn sm" id="gAns">生成答案</button></div>'+
   '<div class="promptblk" id="gPrompt">点「拼装 Prompt」查看四件套：系统指令 / 上下文 / 问题 / 约束。</div>'+
   '<div class="out" id="gOut" style="margin-top:10px"></div>';
  const rule=box.querySelector('#gRule'),p=box.querySelector('#gPrompt'),out=box.querySelector('#gOut');
  const q='2026 年本公司差旅住宿报销标准是多少？';
  const chunks=rankKB('差旅 住宿 标准 报销',2,true);
  let built=false,ruleTouched=false;
  function build(){
    const ctx=chunks.map((c,i)=>'<span class="ctx">['+(i+1)+'] '+esc(c.c)+'  (来源: kb/handbook.md)</span>').join('\n');
    p.innerHTML='<span class="sys">你是资料问答助手。</span>\n'+
      (rule.checked?'<span class="rule">仅依据以下上下文回答，若资料不足就明确说明不知道；每个结论后标注引用编号。</span>':'<span class="r">（未加约束：模型可自由发挥）</span>')+
      '\n\n<span class="sys">=== 上下文 ===</span>\n'+ctx+'\n\n<span class="q">=== 问题 ===\n'+esc(q)+'</span>\n\n<span class="sys">请用中文分点作答。</span>';
    out.innerHTML='<span class="k">提示词长度</span> ≈ '+p.textContent.length+' 字符 · <span class="k">注入片段</span> '+chunks.length+' 条 · <span class="g">切换约束开关后再点「生成答案」对比</span>';
    if(!built){built=true;hit('asm');}
  }
  function answer(){
    if(!built)build();
    if(rule.checked){out.innerHTML='<span class="g">【有约束 · 开卷作答】</span>\n• 一线城市每晚 600 元，其他城市每晚 400 元 [1]\n• 需凭发票报销 [1]\n• 资料未提及餐饮与市内交通标准，故不作补充。\n\n✅ 每个数字都能回溯到 [1]，没有编造。';}
    else{out.innerHTML='<span class="r">【无约束 · 自由发挥】</span>\n• 一般公司差旅住宿约每晚 500 元，一线城市可能上浮至 800 元，通常还包含早餐与税费，另可报销往返机票……\n\n⚠️ 后两句是模型按语言习惯补出来的，<b>资料里根本没有</b> —— 这就是脱离上下文的幻觉。';}
  }
  rule.onchange=()=>{build();answer();if(!ruleTouched){ruleTouched=true;hit('rule');}};
  box.querySelector('#gGo').onclick=build;
  box.querySelector('#gAns').onclick=answer;
};

/* 第 13 刀：端到端 */
EXP.e2e=function(box,L){
  const stages=[
    ['① 语料','prepare.py → input.txt'],['② 训练','train.py → ckpt.pt'],['③ 私有文档','kb/*.md'],
    ['④ 切片','prepare_kb.py → chunks.jsonl'],['⑤ 嵌入','embed.py → 向量库'],['⑥ 检索','retrieve.py → top-k'],
    ['⑦ 增强','拼 Prompt + 约束'],['⑧ 生成','GPT / LLM → 带引用答案'],['⑨ 评估','Recall@k / 忠实度 → 迭代'],
  ];
  box.innerHTML='<div class="lab-head">🧪 端到端流水线（9 步）</div>'+
   '<div class="lab-hint">点任一步看数据在这一站长什么样，或点「播放全流程」从头走一遍。最后跑一次评估，判断该回头改哪一段。</div>'+
   '<div class="stage-row" id="eS"></div>'+
   '<div class="ctl"><button class="btn sm primary" id="ePlay">▶ 播放全流程</button><button class="btn sm" id="eEval">运行评估 →</button></div>'+
   '<div class="out" id="eOut" style="max-height:none"></div>';
  const row=box.querySelector('#eS'),out=box.querySelector('#eOut');
  stages.forEach((s,i)=>{const el=document.createElement('div');el.className='stage';el.textContent=s[0];el.onclick=()=>show(i);row.appendChild(el);});
  let played=false,evaluated=false,timer=null;
  function show(i){row.querySelectorAll('.stage').forEach((e,j)=>e.classList.toggle('active',j===i));
    out.innerHTML='<span class="v">'+stages[i][0]+'</span>  '+esc(stages[i][1])+'\n\n<span class="k">主线位置</span>：'+(i<2?'第一章 · 手搓 GPT':(i<8?'第二章 · 接上 RAG':'第三章 · 合流与评估'))+
      '\n<span class="k">数据形态</span>：'+['纯文本','模型参数','原始文档','小块 JSONL','稠密向量','带分数的片段列表','完整 Prompt','自然语言答案','指标的数值'][i];}
  box.querySelector('#ePlay').onclick=()=>{let i=0;clearInterval(timer);show(0);timer=setInterval(()=>{i++;if(i>=stages.length){clearInterval(timer);if(!played){played=true;hit('play');}return;}show(i);},650);};
  box.querySelector('#eEval').onclick=()=>{
    const res=rankKB('差旅住宿标准',3,true);
    const recall=res.some(o=>o.c.includes('600 元'))?1:0;
    out.innerHTML='<span class="k">检索端</span>\n  Recall@3 = <span class="v">'+recall+'</span>  '+(recall?'（含正确答案的块被召回 ✅）':'（漏检，需回头改切片/嵌入 ⚠️）')+'\n'+
      '  命中分数：'+res.map(o=>o.s.toFixed(3)).join(' / ')+'\n\n'+
      '<span class="k">生成端</span>\n  忠实度 Faithfulness = <span class="v">0.94</span>（答案每个数字都能回溯到 [1]）\n  答案相关性 = <span class="v">0.91</span>\n\n'+
      '<span class="g">定位法</span>：Recall 低 → 迭代第 ④⑤ 刀（切片/嵌入/混合检索）；Recall 高但忠实度低 → 迭代第 ⑦ 刀（Prompt 约束、Reranker、少塞噪声）。\n'+
      '<span class="g">闭环</span>：把这次实战写成 docs/knowledge/rag.md 接入飞轮，gaps 的 RAG 待补项即可勾掉。';
    if(!evaluated){evaluated=true;hit('eval');}
  };
  show(0);
};

/* ---------- 路线图 ---------- */
function openRoadmap(){
  const mb=document.getElementById('mapBody');let h='';
  CHAPTERS.forEach(ch=>{
    h+='<div class="mchap">'+ch.t+'</div><div class="mgrid">';
    ch.levels.forEach(id=>{const L=LEVELS.find(x=>x.id===id),un=isUnlocked(id),done=!!S.done[id];
      h+='<div class="mnode '+(un?'':'lock')+(done?' done':'')+'" data-id="'+id+'"><div class="n">'+(done?'✓ ':'')+id+'. '+esc(L.title)+'</div><div class="d">'+L.goal.replace(/<[^>]+>/g,'').slice(0,42)+'…</div></div>';});
    h+='</div>';
  });
  mb.innerHTML=h;
  mb.querySelectorAll('.mnode').forEach(el=>el.onclick=()=>{const id=+el.dataset.id;if(!isUnlocked(id)){toast('🔒 先通关第 '+(id-1)+' 刀');return;}document.getElementById('roadmapModal').classList.remove('show');go(id);});
  document.getElementById('roadmapModal').classList.add('show');
}
document.getElementById('roadmapBtn').onclick=openRoadmap;
document.getElementById('closeModal').onclick=()=>document.getElementById('roadmapModal').classList.remove('show');
document.getElementById('roadmapModal').onclick=e=>{if(e.target.id==='roadmapModal')e.target.classList.remove('show');};
document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('确定清空全部 13 关进度？此操作不可撤销。'))return;
  S={done:{},tasks:{}};save();CUR=1;render();toast('进度已清空，从第 1 刀重新开始');
};

/* ---------- 工具 ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2300);}

/* ---------- 初始化 ---------- */
(function init(){
  // 停在「第一个未通关」的关卡：全新用户 = 第 1 刀；全部通关 = 最后一刀
  let cur=1;
  for(const L of LEVELS){ if(S.done[L.id]) cur=L.id+1; else break; }
  CUR=Math.min(cur,LEVELS.length);
  if(!isUnlocked(CUR)) CUR=1;   // 兜底：绝不落在锁定关卡上
  render();
})();
</script>

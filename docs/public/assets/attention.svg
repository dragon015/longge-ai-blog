<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="450" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">缩放点积注意力：Q·K 打分 → softmax → 加权取 V</text>

  <rect x="275" y="40" width="130" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="60" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">输入序列</text>

  <line x1="300" y1="70" x2="135" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="340" y1="70" x2="340" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="70" x2="545" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="92" width="150" height="34" rx="8" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
  <text x="135" y="114" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Q 查询</text>
  <rect x="265" y="92" width="150" height="34" rx="8" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
  <text x="340" y="114" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">K 键</text>
  <rect x="470" y="92" width="150" height="34" rx="8" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
  <text x="545" y="114" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">V 值</text>

  <line x1="135" y1="126" x2="135" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="340" y1="126" x2="340" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="175" y="152" width="330" height="40" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="340" y="177" text-anchor="middle" fill="#134e4a" font-size="13" font-weight="700">相似度评分：QKᵀ / √dₖ</text>

  <line x1="340" y1="192" x2="340" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="175" y="218" width="330" height="38" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="340" y="242" text-anchor="middle" fill="#134e4a" font-size="13" font-weight="700">softmax → 注意力权重（0~1，和为 1）</text>

  <line x1="340" y1="256" x2="340" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="160" y="282" width="360" height="42" rx="8" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
  <text x="340" y="308" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">权重 ⊙ V → 加权求和输出</text>

  <path d="M545,126 L610,126 L610,303 L520,303" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arT)"/>
  <text x="618" y="220" fill="#0f766e" font-size="11" font-weight="700">V</text>

  <line x1="340" y1="324" x2="340" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="255" y="348" width="170" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="368" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">注意力输出</text>

  <rect x="30" y="398" width="620" height="40" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="44" y="415" fill="#9a3412" font-size="11.5" font-weight="700">公式：Attention(Q,K,V)=softmax(QKᵀ/√dₖ)·V</text>
  <text x="44" y="432" fill="#9a3412" font-size="11.5">💡 KV 缓存：推理时缓存 K/V 免重复计算；GQA / MLA 进一步压缩显存，决定长上下文成本。</text>
</svg>

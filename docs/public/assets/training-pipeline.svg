<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="430" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">预训练 → 后训练：模型从「毛坯」到「成品」</text>

  <rect x="20" y="60" width="140" height="60" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="86" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">海量无标注</text>
  <text x="90" y="106" text-anchor="middle" fill="#475569" font-size="11">网页/书籍/代码</text>

  <line x1="160" y1="90" x2="200" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="200" y="60" width="180" height="60" rx="12" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="290" y="84" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">预训练 Pre-training</text>
  <text x="290" y="106" text-anchor="middle" fill="#ede9fe" font-size="11">自监督 · 预测下一个词</text>

  <line x1="380" y1="90" x2="420" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="420" y="60" width="160" height="60" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="500" y="86" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="700">基础模型</text>
  <text x="500" y="106" text-anchor="middle" fill="#7c3aed" font-size="11">博学但没规矩</text>

  <line x1="500" y1="120" x2="500" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="300" y="150" width="400" height="34" rx="10" fill="#5b21b6" stroke="#4c1d95" stroke-width="2"/>
  <text x="500" y="172" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">后训练 Post-training（调教成好用的助手）</text>

  <line x1="420" y1="184" x2="360" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="184" x2="500" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="580" y1="184" x2="640" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="270" y="216" width="180" height="56" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="360" y="242" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="700">SFT 监督微调</text>
  <text x="360" y="262" text-anchor="middle" fill="#7c3aed" font-size="11">教格式与能力</text>

  <rect x="420" y="216" width="180" height="56" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="510" y="242" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="700">RLHF / DPO</text>
  <text x="510" y="262" text-anchor="middle" fill="#7c3aed" font-size="11">对齐人类偏好</text>

  <rect x="570" y="216" width="180" height="56" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="660" y="242" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="700">RLVR</text>
  <text x="660" y="262" text-anchor="middle" fill="#7c3aed" font-size="11">可验证奖励·会思考</text>

  <line x1="360" y1="272" x2="360" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="510" y1="272" x2="510" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="660" y1="272" x2="660" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M360,300 L360,318 L660,318 L660,300" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arV)"/>
  <rect x="330" y="318" width="320" height="56" rx="12" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="490" y="344" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">能用的对话 / 推理模型</text>
  <text x="490" y="364" text-anchor="middle" fill="#ede9fe" font-size="11">会听话、会思考、按指令办事</text>

  <rect x="30" y="392" width="620" height="34" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="44" y="414" fill="#9a3412" font-size="12">💡 成本对比：预训练是「几千张卡跑几个月」的天价；后训练相对便宜，却决定了产品体验。后训练详见 <tspan font-weight="700">/post-training/</tspan>。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arI" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Transformer 架构：编码器 + 解码器（现代 LLM 只用右半边）</text>

  <rect x="270" y="40" width="140" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="60" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">输入 tokens</text>
  <line x1="340" y1="70" x2="340" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="245" y="86" width="190" height="32" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <text x="340" y="107" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">词嵌入 + 位置编码</text>

  <line x1="300" y1="118" x2="175" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="118" x2="505" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Encoder -->
  <rect x="30" y="134" width="290" height="180" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <rect x="30" y="134" width="290" height="32" rx="14" fill="#6366f1"/>
  <text x="175" y="155" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">① 编码器 Encoder ×N</text>
  <rect x="50" y="178" width="250" height="120" rx="10" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="64" y="202" fill="#3730a3" font-size="11" font-weight="700">Transformer Block（重复 N 次）</text>
  <text x="64" y="224" fill="#0f172a" font-size="12">· 多头自注意力 Multi-Head Attn</text>
  <text x="64" y="246" fill="#0f172a" font-size="12">· 残差 + Add &amp; Norm</text>
  <text x="64" y="268" fill="#0f172a" font-size="12">· 前馈网络 FFN</text>
  <text x="64" y="290" fill="#0f172a" font-size="12">· 残差 + Add &amp; Norm</text>

  <!-- Decoder -->
  <rect x="360" y="134" width="290" height="180" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <rect x="360" y="134" width="290" height="32" rx="14" fill="#4f46e5"/>
  <text x="505" y="155" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">② 解码器 Decoder ×N</text>
  <rect x="380" y="178" width="250" height="120" rx="10" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="394" y="202" fill="#3730a3" font-size="11" font-weight="700">Transformer Block（重复 N 次）</text>
  <text x="394" y="224" fill="#0f172a" font-size="12">· 掩码多头注意力（不看未来）</text>
  <text x="394" y="246" fill="#0f172a" font-size="12">· 交叉注意力（看编码器输出）</text>
  <text x="394" y="268" fill="#0f172a" font-size="12">· 残差 + Add &amp; Norm</text>
  <text x="394" y="290" fill="#0f172a" font-size="12">· 前馈网络 FFN</text>

  <!-- cross attention KV -->
  <path d="M320,220 C345,220 335,220 360,220" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arI)"/>
  <text x="340" y="214" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">KV</text>

  <!-- decoder -> output -->
  <line x1="505" y1="314" x2="505" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="430" y="338" width="150" height="30" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <text x="505" y="358" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Linear + Softmax</text>
  <line x1="505" y1="368" x2="505" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="430" y="388" width="150" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="505" y="408" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">输出 tokens</text>

  <text x="175" y="340" text-anchor="middle" fill="#64748b" font-size="11">原始 Transformer 用于翻译，</text>
  <text x="175" y="356" text-anchor="middle" fill="#64748b" font-size="11">两端都有</text>

  <rect x="30" y="424" width="620" height="36" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="44" y="447" fill="#9a3412" font-size="12">💡 现代主流 LLM（GPT / Claude / DeepSeek）只用 <tspan font-weight="700">② 解码器堆叠（Decoder-only）</tspan>，靠掩码注意力自回归生成，去掉了编码器。</text>
</svg>

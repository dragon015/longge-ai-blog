<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="450" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">LLM 全链路：从文字到「下一个 token」</text>

  <rect x="40" y="58" width="120" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">输入文本</text>
  <line x1="160" y1="80" x2="196" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="196" y="58" width="130" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="261" y="80" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Tokenization</text>
  <line x1="326" y1="80" x2="362" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="362" y="58" width="130" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="427" y="80" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Embedding</text>
  <line x1="492" y1="80" x2="528" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="528" y="58" width="150" height="44" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="603" y="80" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Transformer ×N</text>
  <text x="603" y="98" text-anchor="middle" fill="#bfdbfe" font-size="10">注意力+FFN</text>

  <line x1="603" y1="102" x2="603" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="510" y="140" width="186" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="603" y="162" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Unembedding + Softmax</text>
  <text x="603" y="180" text-anchor="middle" fill="#1e40af" font-size="10">概率分布 over 词表</text>

  <line x1="603" y1="184" x2="603" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="510" y="220" width="186" height="48" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="603" y="246" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">输出下一个 Token</text>
  <text x="603" y="264" text-anchor="middle" fill="#bfdbfe" font-size="11">采样 / 贪心</text>

  <path d="M510,244 L470,244 L470,80 L196,80" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arB)"/>
  <text x="333" y="160" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="700">自回归循环</text>
  <text x="333" y="178" text-anchor="middle" fill="#2563eb" font-size="11">把新 token 接回输入，直到停</text>

  <rect x="40" y="300" width="600" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="60" y="326" fill="#1e40af" font-size="13" font-weight="700">能力外溢：同一个「预测下一个 token」本领，撑起所有应用</text>
  <rect x="60" y="340" width="170" height="60" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="145" y="364" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">💬 聊天对话</text>
  <text x="145" y="386" text-anchor="middle" fill="#475569" font-size="11">理解意图·连贯回复</text>
  <rect x="255" y="340" width="170" height="60" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="340" y="364" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">👨‍💻 写代码</text>
  <text x="340" y="386" text-anchor="middle" fill="#475569" font-size="11">补全·生成·改 Bug</text>
  <rect x="450" y="340" width="170" height="60" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="535" y="364" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">🌐 翻译 / 总结</text>
  <text x="535" y="386" text-anchor="middle" fill="#475569" font-size="11">跨语言·长文压缩</text>
</svg>

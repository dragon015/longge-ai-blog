<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="460" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Claude 家族：成本 vs 能力定位</text>

  <!-- 坐标系 -->
  <line x1="80" y1="410" x2="640" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="640" y="430" text-anchor="end" fill="#475569" font-size="12" font-weight="700">能力 ↑</text>
  <line x1="80" y1="410" x2="80" y2="60" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="70" y="56" text-anchor="end" fill="#475569" font-size="12" font-weight="700">成本 →</text>

  <!-- Opus -->
  <rect x="470" y="90" width="150" height="70" rx="12" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <text x="545" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Opus</text>
  <text x="545" y="138" text-anchor="middle" fill="#ffedd5" font-size="10">最强推理·长任务</text>
  <text x="545" y="152" text-anchor="middle" fill="#ffedd5" font-size="10">预算敏感慎用</text>
  <line x1="545" y1="160" x2="80" y2="410" stroke="#fdba74" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sonnet -->
  <rect x="300" y="220" width="150" height="70" rx="12" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <text x="375" y="248" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Sonnet</text>
  <text x="375" y="268" text-anchor="middle" fill="#ffedd5" font-size="10">性价比均衡</text>
  <text x="375" y="282" text-anchor="middle" fill="#ffedd5" font-size="10">Agent/编码首选</text>
  <line x1="375" y1="290" x2="80" y2="410" stroke="#fdba74" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Haiku -->
  <rect x="130" y="330" width="150" height="70" rx="12" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <text x="205" y="358" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Haiku</text>
  <text x="205" y="378" text-anchor="middle" fill="#ffedd5" font-size="10">最便宜·低延迟</text>
  <text x="205" y="392" text-anchor="middle" fill="#ffedd5" font-size="10">高并发简单任务</text>
  <line x1="205" y1="400" x2="80" y2="410" stroke="#fdba74" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 代次时间线 -->
  <rect x="20" y="44" width="640" height="0" rx="0" fill="none"/>
  <text x="340" y="445" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">代次：Claude 1 (2023) → 2 (2023) → 3 (2024) → 3.5 (2024) → 4 (2025)；均基于 Transformer 解码器 + GQA/MQA + RoPE</text>

  <rect x="460" y="360" width="200" height="80" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="560" y="384" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="700">宪法式 AI（3H）</text>
  <text x="560" y="406" text-anchor="middle" fill="#0f172a" font-size="10">Helpful · Honest · Harmless</text>
  <text x="560" y="424" text-anchor="middle" fill="#475569" font-size="9">用原则自我审查，减人工标注</text>
</svg>

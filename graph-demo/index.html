<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙哥的AI进阶之路 · 知识图谱（方案演示）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(rgba(56,189,248,0.06) 1px, transparent 1px),
      radial-gradient(ellipse at 50% 35%, #111d3d 0%, #070b1f 55%, #04070f 100%);
    background-size: 26px 26px, 100% 100%;
    color: #e2e8f0;
  }
  #graph { position: fixed; inset: 0; }

  .hud {
    position: fixed; z-index: 10;
    background: rgba(10, 16, 34, 0.74);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(2, 8, 23, 0.55), inset 0 0 18px rgba(56, 189, 248, 0.04);
  }

  /* 顶部标题 + 统计 */
  .hud-top {
    top: 18px; left: 18px; right: 18px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; gap: 16px; flex-wrap: wrap;
  }
  .hud-top h1 {
    font-size: 19px; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #22d3ee, #818cf8, #e879f9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud-top .subtitle { font-size: 12px; color: #8ea3c0; margin-top: 3px; }
  .hud-top .subtitle b { color: #22d3ee; font-weight: 600; }
  .stats { display: flex; gap: 10px; }
  .stat {
    text-align: center; padding: 6px 14px; border-radius: 10px;
    background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.18);
  }
  .stat b { display: block; font-size: 18px; color: #38bdf8; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: #8ea3c0; }

  /* 图例 */
  .hud-legend { top: 96px; right: 18px; padding: 12px 14px; max-width: 190px; }
  .hud-legend h2 { font-size: 12px; color: #8ea3c0; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 3px 6px; border-radius: 6px; cursor: default;
    transition: background 0.15s;
  }
  .legend-item:hover { background: rgba(56, 189, 248, 0.1); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  .legend-item .cnt { margin-left: auto; color: #64748b; font-size: 11px; font-variant-numeric: tabular-nums; }

  /* 底部提示 + 按钮 */
  .hud-hints {
    left: 18px; bottom: 18px; padding: 10px 16px;
    display: flex; gap: 16px; font-size: 12px; color: #9fb2cc; flex-wrap: wrap;
  }
  .hud-actions { right: 18px; bottom: 18px; padding: 10px; display: flex; gap: 8px; }
  .hud-actions button {
    font: inherit; font-size: 12px; color: #cbe4ff; cursor: pointer;
    background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 8px; padding: 6px 12px; transition: all 0.15s;
  }
  .hud-actions button:hover { background: rgba(56, 189, 248, 0.22); box-shadow: 0 0 12px rgba(56, 189, 248, 0.35); }

  /* 点击提示 */
  .toast {
    position: fixed; z-index: 20; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: rgba(10, 16, 34, 0.9); border: 1px solid rgba(34, 211, 238, 0.45);
    border-radius: 12px; padding: 12px 20px; text-align: center;
    box-shadow: 0 0 28px rgba(34, 211, 238, 0.25);
    transition: opacity 0.25s, transform 0.25s;
  }
  .toast.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(8px); }
  .toast b { color: #22d3ee; font-size: 14px; }
  .toast .route { display: block; font-family: Consolas, monospace; font-size: 12px; color: #a5b4fc; margin-top: 2px; }
  .toast .note { display: block; font-size: 11px; color: #64748b; margin-top: 4px; }

  .credit {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: 4px; font-size: 10px; color: #475569; letter-spacing: 0.5px;
  }

  @media (max-width: 760px) {
    .hud-legend { display: none; }
    .hud-hints { display: none; }
  }
</style>
</head>
<body>
<div id="graph"></div>

<header class="hud hud-top">
  <div>
    <h1>龙哥的AI进阶之路 · 知识图谱</h1>
    <p class="subtitle">力导向交互图谱 <b>方案演示</b> · 数据即你博客的真实笔记与链接</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<aside class="hud hud-legend" id="legend"><h2>领域（悬停筛选）</h2></aside>

<div class="hud hud-hints">
  <span>🖱️ 悬停高亮邻居</span><span>👆 拖拽节点</span><span>🔍 滚轮缩放</span><span>💡 点击查看目标页</span>
</div>

<div class="hud hud-actions">
  <button id="btn-fit">⛶ 重置视图</button>
  <button id="btn-reheat">🌀 重新布局</button>
</div>

<div id="toast" class="toast hidden"></div>
<div class="credit">force-graph v1.52 · github.com/vasturiano/force-graph (MIT) · 物理布局 d3-force</div>

<script src="force-graph.min.js"></script>
<script src="graph-data.js"></script>
<script>
(function () {
  const data = JSON.parse(JSON.stringify(window.GRAPH_DATA));

  /* ---------- 领域配色（深海军蓝 + 霓虹） ---------- */
  const DOMAIN_COLORS = {
    '地基': '#22d3ee',
    '核心骨架': '#38bdf8',
    '训练': '#a78bfa',
    '模型与应用': '#f472b6',
    '模型笔记': '#818cf8',
    '后训练专题': '#c084fc',
    'Agent 专题': '#2dd4bf',
    '模型架构专题': '#60a5fa',
    '训练系统专题': '#fbbf24',
    '推理模型专题': '#f87171',
    '推理优化专题': '#34d399',
    '评测专题': '#fb923c',
  };
  const FALLBACK = '#94a3b8';
  const DIM_NODE = 'rgba(100,116,139,0.28)';
  const colorOf = (n) => DOMAIN_COLORS[n.domain] || FALLBACK;
  const alpha = (hex, a) => {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  };

  /* ---------- 邻接表 / 度数 / 节点半径 ---------- */
  const adjacency = {};
  data.nodes.forEach(n => { adjacency[n.id] = new Set([n.id]); });
  data.links.forEach(l => {
    (adjacency[l.source] || (adjacency[l.source] = new Set([l.source]))).add(l.target);
    (adjacency[l.target] || (adjacency[l.target] = new Set([l.target]))).add(l.source);
  });
  data.nodes.forEach(n => {
    n.r = Math.min(16, 5 + Math.sqrt(adjacency[n.id].size - 1) * 2.6);
    n.val = n.r;
  });

  /* ---------- 交互状态 ---------- */
  const state = { hover: null, domain: null };
  let neighborSet = null;

  /* ---------- 图谱实例 ---------- */
  const graph = ForceGraph()(document.getElementById('graph'))
    .graphData(data)
    .backgroundColor('rgba(0,0,0,0)')
    .width(window.innerWidth)
    .height(window.innerHeight)
    .nodeRelSize(1)

  graph
    .d3Force('charge').strength(-420).distanceMax(620)
  const centerForce = graph.d3Force('center');
  if (centerForce) centerForce.strength(0.05);
  const collide = graph.d3Force('collide');
  if (collide) collide.radius(d => d.r + 8).strength(0.9);
  // force-graph v1.x 没有 linkDistance/linkStrength，链接距离/强度走 d3-force 的 link force
  const linkForce = graph.d3Force('link');
  if (linkForce) {
    linkForce.distance(l => 66 + (l.source.r || 6) + (l.target.r || 6));
    linkForce.strength(0.32);
  }

  graph
    .linkColor(l => {
      const lit = state.hover
        ? (state.hover.id === l.source.id || state.hover.id === l.target.id)
        : true;
      return lit ? alpha(colorOf(l.source), 0.42) : 'rgba(148,163,184,0.05)';
    })
    .linkWidth(l => (state.hover && (state.hover.id === l.source.id || state.hover.id === l.target.id)) ? 1.8 : 0.9)
    .linkDirectionalParticles(l => (state.hover && (state.hover.id === l.source.id || state.hover.id === l.target.id)) ? 2 : 0)
    .linkDirectionalParticleWidth(1.8)
    .linkDirectionalParticleSpeed(0.004)
    .linkDirectionalParticleColor(l => colorOf(l.source))

    .nodeCanvasObjectMode('replace')
    .nodeCanvasObject((node, ctx, scale) => {
      const lit = state.hover
        ? (neighborSet && neighborSet.has(node.id))
        : (state.domain ? node.domain === state.domain : true);
      const r = node.r;
      if (lit) {
        ctx.shadowColor = colorOf(node);
        ctx.shadowBlur = 16;
      }
      ctx.beginPath();
      ctx.arc(node.x, node.y, r, 0, Math.PI * 2, false);
      ctx.fillStyle = lit ? colorOf(node) : DIM_NODE;
      ctx.fill();
      ctx.shadowBlur = 0;
      // 内核
      ctx.beginPath();
      ctx.arc(node.x, node.y, r * 0.42, 0, Math.PI * 2, false);
      ctx.fillStyle = lit ? 'rgba(241,249,255,0.92)' : 'rgba(148,163,184,0.35)';
      ctx.fill();
      // 外环
      ctx.beginPath();
      ctx.arc(node.x, node.y, r, 0, Math.PI * 2, false);
      ctx.strokeStyle = lit ? 'rgba(226,232,240,0.75)' : 'rgba(100,116,139,0.3)';
      ctx.lineWidth = 1 / scale;
      ctx.stroke();
      // 标签
      ctx.font = `600 ${11 / scale}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = lit ? 'rgba(226,232,240,0.95)' : 'rgba(148,163,184,0.35)';
      ctx.fillText(node.title, node.x, node.y + r + 3 / scale);
    })
    .nodePointerAreaPaint((node, color, ctx) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r + 6, 0, Math.PI * 2, false);
      ctx.fill();
    })
    .nodeLabel(node => {
      const nb = adjacency[node.id].size - 1;
      return `<div style="font-family:inherit;background:rgba(10,16,34,.92);border:1px solid ${alpha(colorOf(node),0.5)};border-radius:8px;padding:6px 10px;font-size:12px;color:#e2e8f0;box-shadow:0 0 16px ${alpha(colorOf(node),0.3)}">
        <b style="color:${colorOf(node)}">${node.title}</b><br>
        <span style="color:#8ea3c0;font-size:11px">${node.domain} · ${nb} 个邻居 · ${node.route}</span>
      </div>`;
    })
    .onNodeHover(node => {
      state.hover = node || null;
      neighborSet = node ? adjacency[node.id] : null;
      document.body.style.cursor = node ? 'pointer' : 'default';
    })
    .onNodeClick(node => {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<b>📍 ${node.title}</b><span class="route">${node.route}</span><span class="note">演示版不跳转 —— 集成进博客后，点击即直达该笔记</span>`;
      toast.classList.remove('hidden');
    })
    .onBackgroundClick(() => document.getElementById('toast').classList.add('hidden'));

  graph.onEngineStop(() => graph.zoomToFit(1400, 80));

  /* ---------- 统计 ---------- */
  const domainCount = {};
  data.nodes.forEach(n => { domainCount[n.domain] = (domainCount[n.domain] || 0) + 1; });
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${data.nodes.length}</b><span>笔记</span></div>` +
    `<div class="stat"><b>${data.links.length}</b><span>链接</span></div>` +
    `<div class="stat"><b>${Object.keys(domainCount).length}</b><span>领域</span></div>`;

  /* ---------- 图例 ---------- */
  const legend = document.getElementById('legend');
  Object.entries(domainCount)
    .sort((a, b) => b[1] - a[1])
    .forEach(([domain, cnt]) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-dot" style="background:${DOMAIN_COLORS[domain] || FALLBACK};color:${DOMAIN_COLORS[domain] || FALLBACK}"></span>${domain}<span class="cnt">${cnt}</span>`;
      item.addEventListener('mouseenter', () => { state.domain = domain; });
      item.addEventListener('mouseleave', () => { state.domain = null; });
      legend.appendChild(item);
    });

  /* ---------- 按钮 ---------- */
  document.getElementById('btn-fit').addEventListener('click', () => graph.zoomToFit(800, 80));
  document.getElementById('btn-reheat').addEventListener('click', () => {
    graph.d3ReheatSimulation();
    graph.zoomToFit(1400, 80);
  });

  window.addEventListener('resize', () => {
    graph.width(window.innerWidth);
    graph.height(window.innerHeight);
  });
})();
</script>
</body>
</html>
